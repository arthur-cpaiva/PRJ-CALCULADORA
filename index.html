<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./CSS/style.css">
    <script src="./JS/main.js" defer></script>
</head>

<body>
    <h1>Calculadora</h1>
    <form action="#" class="box">
        <input type="text" id="num1" placeholder="Primeiro número">
        <input type="text" id="num2" placeholder="Segundo número">

        <div class="btn-area">
            <button id="btnSomar">Somar</button>
            <button id="btnSubtrair">Subtrair</button>
            <button id="btnMultiplicar">Multiplicar</button>
            <button id="btnDividir">Dividir</button>
            <button id="btnLimpar">Limpar</button>
        </div>
    </form>
    
    <div class="box invisible">
        <p id="resultado"></p>
    </div>
</body>

</html>
